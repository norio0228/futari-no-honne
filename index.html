<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff0f5">
<title>💕 ふたりのホンネ</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:18px;
 min-height:100dvh;
 display:grid;place-items:center;
 background:linear-gradient(145deg,#fff0f5,#ffe5ec);
 font-family:-apple-system,BlinkMacSystemFont,sans-serif;
 color:#49343d
}
main{
 width:100%;max-width:430px;
 background:white;border-radius:26px;
 padding:28px 22px;text-align:center;
 box-shadow:0 12px 35px #cf739333
}
h1{color:#db6085;font-size:27px;margin:8px 0}
h2{font-size:21px;overflow-wrap:anywhere}
p{line-height:1.7}
input,textarea{
 width:100%;padding:15px;margin:8px 0;
 border:1px solid #e9c6d1;border-radius:14px;
 font:inherit;font-size:16px
}
textarea{height:110px;resize:vertical}
button{
 border:0;border-radius:14px;
 padding:15px;font-size:16px;
 font-weight:bold;cursor:pointer
}
button:disabled{opacity:.5}
.primary{
 width:100%;margin:9px 0;
 background:#e66b91;color:white
}
.secondary{background:#ffe0ea;color:#a83d60}
.choices{display:flex;gap:12px}
.choices button{flex:1}
.hidden{display:none!important}
.code{
 font-size:34px;font-weight:bold;
 color:#d95680;letter-spacing:5px
}
.muted{color:#947d86;font-size:13px}
.status{font-size:14px;color:#99627a}
.answers{display:flex;gap:10px;margin:20px 0}
.answers>div{
 flex:1;padding:18px 5px;
 border-radius:15px;background:#fff0f5;
 font-size:20px;font-weight:bold
}
.answers small{font-size:13px;color:#947d86}
#error{color:#ba244d;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>💕 ふたりのホンネ</h1>
<p>ふたりの気持ちを、YES・NOで。</p>
<p id="status" class="status">接続しています…</p>
<p id="error" role="alert"></p>

<section id="home" class="hidden">
 <button id="create" class="primary">部屋を作る ♡</button>
 <p>または参加コードを入力</p>
 <input id="joinCode" placeholder="6桁の参加コード"
 maxlength="6" inputmode="numeric">
 <button id="join" class="primary">部屋に参加</button>
</section>

<section id="room" class="hidden">
 <p>ふたりの部屋 ♡</p>
 <div id="roomCode" class="code"></div>
 <button id="share" class="secondary">参加リンクを共有</button>
 <p id="members" class="muted"></p>

 <section id="editor" class="hidden">
  <textarea id="questionInput"
   placeholder="ふたりに聞きたい質問を入力してね"
   maxlength="200"></textarea>
  <button id="ask" class="primary">質問する ♡</button>
 </section>

 <section id="vote" class="hidden">
  <h2 id="voteQuestion"></h2>
  <p>あなたの答えは？</p>
  <div class="choices">
   <button class="secondary" id="yes">♡ YES</button>
   <button class="secondary" id="no">NO</button>
  </div>
 </section>

 <section id="waiting" class="hidden">
  <h2 id="waitingQuestion"></h2>
  <p>回答したよ ♡</p>
  <p>相手の回答を待っています…</p>
 </section>

 <section id="result" class="hidden">
  <h2 id="resultQuestion"></h2>
  <p>ふたりの回答 ♡</p>
  <div class="answers">
   <div><small>あなた</small><p id="mine"></p></div>
   <div><small>相手</small><p id="theirs"></p></div>
  </div>
  <button id="next" class="primary">次の質問へ ♡</button>
 </section>

 <button id="leave" class="secondary"
 style="margin-top:20px">部屋から退出</button>
</section>

<p class="muted">
 質問と回答は次の質問で消去されます。<br>
 部屋のデータは退出後も残る場合があります。
</p>
</main>

<script type="module">
import {initializeApp} from
 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {
 getAuth,signInAnonymously,onAuthStateChanged
} from
 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {
 getFirestore,doc,getDoc,setDoc,onSnapshot,
 runTransaction,serverTimestamp
} from
 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';

const firebaseConfig={
 apiKey:"AIzaSyBpGIfu3jOksMS8_jPAUPXHuh4GzgwyUq8",
 authDomain:"futari-no-honne.firebaseapp.com",
 projectId:"futari-no-honne",
 storageBucket:"futari-no-honne.firebasestorage.app",
 messagingSenderId:"512221931738",
 appId:"1:512221931738:web:e69b8fd62b46c6eaa69de3"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const $=id=>document.getElementById(id);
const show=(id,visible)=>
 $(id).classList.toggle('hidden',!visible);

let uid=null;
let roomCode=null;
let room=null;
let unsubscribe=null;
let busy=false;
let authInitialized=false;

function setStatus(message){
 $('status').textContent=message;
}

function clearError(){
 $('error').textContent='';
}

function showError(error){
 console.error(error);
 $('error').textContent=
  error.code==='permission-denied'
  ? 'アクセスが拒否されました。Firestoreルールを確認してね。'
  : error.message||String(error);
}

function roomRef(code){
 return doc(db,'rooms',code);
}

function generateCode(){
 return String(Math.floor(100000+Math.random()*900000));
}

function setBusy(value){
 busy=value;
 $('create').disabled=value;
 $('join').disabled=value;
}

function render(){
 show('home',!roomCode);
 show('room',!!roomCode);

 if(!roomCode||!room)return;

 $('roomCode').textContent=roomCode;

 const members=room.members||[];
 const answers=room.answers||{};
 const question=room.question||'';
 const myAnswer=answers[uid];
 const otherUid=members.find(id=>id!==uid);
 const otherAnswer=answers[otherUid];
 const bothAnswered=!!myAnswer&&!!otherAnswer;

 $('members').textContent=
  members.length+'/2人が参加中';

 show('editor',members.length===2&&!question);
 show('vote',!!question&&!myAnswer);
 show('waiting',!!question&&!!myAnswer&&!bothAnswered);
 show('result',!!question&&bothAnswered);

 if(question){
  $('voteQuestion').textContent=question;
  $('waitingQuestion').textContent=question;
  $('resultQuestion').textContent=question;
 }

 if(bothAnswered){
  $('mine').textContent=myAnswer;
  $('theirs').textContent=otherAnswer;
 }
}

function listen(code){
 if(unsubscribe)unsubscribe();

 roomCode=code;
 room=null;
 sessionStorage.setItem('futariRoom',code);

 const url=new URL(location.href);
 url.searchParams.set('room',code);
 history.replaceState(null,'',url);

 unsubscribe=onSnapshot(roomRef(code),snapshot=>{
  if(!snapshot.exists()){
   showError(Error('部屋が見つかりません'));
   leaveRoom(false);
   return;
  }

  const data=snapshot.data();

  if(!data.members.includes(uid)){
   showError(Error('この部屋には参加していません'));
   return;
  }

  room=data;
  setStatus('接続中 ♡');
  render();
 },showError);

 render();
}

async function createRoom(){
 if(busy||!uid)return;
 setBusy(true);
 clearError();

 try{
  let code=null;

  for(let i=0;i<15;i++){
   const candidate=generateCode();

   if(!(await getDoc(roomRef(candidate))).exists()){
    code=candidate;
    break;
   }
  }

  if(!code)throw Error('部屋を作れませんでした');

  await setDoc(roomRef(code),{
   members:[uid],
   question:'',
   answers:{},
   createdAt:serverTimestamp()
  });

  listen(code);
 }catch(error){
  showError(error);
 }finally{
  setBusy(false);
 }
}

async function joinRoom(code){
 if(busy||!uid)return;
 setBusy(true);
 clearError();

 try{
  code=String(code).trim();

  if(!/^\d{6}$/.test(code)){
   throw Error('6桁の参加コードを入力してね');
  }

  await runTransaction(db,async transaction=>{
   const ref=roomRef(code);
   const snapshot=await transaction.get(ref);

   if(!snapshot.exists()){
    throw Error('部屋が見つかりません');
   }

   const members=snapshot.data().members;

   if(!Array.isArray(members)){
    throw Error('部屋のデータが不正です');
   }

   if(!members.includes(uid)){
    if(members.length>=2){
     throw Error('この部屋は満員です');
    }

    transaction.update(ref,{
     members:[...members,uid]
    });
   }
  });

  listen(code);
 }catch(error){
  showError(error);
 }finally{
  setBusy(false);
 }
}

async function askQuestion(){
 if(!roomCode)return;
 clearError();

 const question=$('questionInput').value.trim();

 if(!question){
  showError(Error('質問を入力してね'));
  return;
 }

 try{
  await runTransaction(db,async transaction=>{
   const ref=roomRef(roomCode);
   const snapshot=await transaction.get(ref);
   const data=snapshot.data();

   if(!data||data.members.length!==2||data.question){
    throw Error('今は質問を開始できません');
   }

   transaction.update(ref,{
    question,
    answers:{}
   });
  });

  $('questionInput').value='';
 }catch(error){
  showError(error);
 }
}

async function answer(value){
 if(!roomCode||!uid)return;
 clearError();

 try{
  await runTransaction(db,async transaction=>{
   const ref=roomRef(roomCode);
   const snapshot=await transaction.get(ref);
   const data=snapshot.data();

   if(!data||!data.question){
    throw Error('回答できる質問がありません');
   }

   if(data.answers[uid])return;

   transaction.update(ref,{
    answers:{
     ...data.answers,
     [uid]:value
    }
   });
  });
 }catch(error){
  showError(error);
 }
}

async function nextQuestion(){
 if(!roomCode)return;
 clearError();

 try{
  await runTransaction(db,async transaction=>{
   const ref=roomRef(roomCode);
   const snapshot=await transaction.get(ref);
   const data=snapshot.data();

   if(!data||Object.keys(data.answers).length!==2){
    throw Error('まだ2人の回答がそろっていません');
   }

   transaction.update(ref,{
    question:'',
    answers:{}
   });
  });
 }catch(error){
  showError(error);
 }
}

function leaveRoom(clear=true){
 if(unsubscribe){
  unsubscribe();
  unsubscribe=null;
 }

 roomCode=null;
 room=null;

 sessionStorage.removeItem('futariRoom');

 const url=new URL(location.href);
 url.searchParams.delete('room');
 history.replaceState(null,'',url);

 setStatus('準備できたよ ♡');
 if(clear)clearError();
 render();
}

$('create').onclick=createRoom;
$('join').onclick=()=>joinRoom($('joinCode').value);
$('ask').onclick=askQuestion;
$('yes').onclick=()=>answer('YES');
$('no').onclick=()=>answer('NO');
$('next').onclick=nextQuestion;
$('leave').onclick=()=>leaveRoom();

$('share').onclick=async()=>{
 const url=new URL(location.href);
 url.searchParams.set('room',roomCode);

 try{
  if(navigator.share){
   await navigator.share({
    title:'ふたりのホンネ',
    text:'参加コード：'+roomCode,
    url:url.toString()
   });
  }else{
   await navigator.clipboard.writeText(url.toString());
   alert('参加リンクをコピーしたよ ♡');
  }
 }catch(error){
  if(error.name!=='AbortError')showError(error);
 }
};

onAuthStateChanged(auth,async user=>{
 if(!user){
  uid=null;

  if(!authInitialized){
   authInitialized=true;

   try{
    await signInAnonymously(auth);
   }catch(error){
    showError(error);
    setStatus('認証に失敗しました');
   }
  }
  return;
 }

 uid=user.uid;
 setStatus('準備できたよ ♡');

 if(!authInitialized){
  authInitialized=true;

  const urlCode=
   new URLSearchParams(location.search).get('room');

  const savedCode=
   sessionStorage.getItem('futariRoom');

  const code=urlCode||savedCode;

  if(code){
   await joinRoom(code);
  }else{
   render();
  }
 }else{
  render();
 }
},showError);
</script>
</body>
</html>
