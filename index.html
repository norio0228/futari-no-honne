
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff0f5">
<title>💕 ふたりのホンネ</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100dvh;padding:20px 14px;
 display:grid;place-items:center;
 background:linear-gradient(150deg,#fff2f7,#ffe1eb);
 font-family:-apple-system,BlinkMacSystemFont,sans-serif;
 color:#523944
}
main{
 position:relative;width:100%;max-width:430px;
 background:white;border-radius:26px;
 padding:48px 22px 28px;text-align:center;
 box-shadow:0 12px 36px #c85b8330
}
h1{font-size:26px;color:#dc638b;margin:8px 0}
h2{font-size:21px;overflow-wrap:anywhere}
p{line-height:1.7}
button{
 border:0;border-radius:14px;padding:15px;
 font-size:16px;font-weight:700;cursor:pointer
}
button:disabled{opacity:.5}
.primary{width:100%;background:#e66b91;color:white;margin:8px 0}
.secondary{background:#ffe0eb;color:#a63b61}
.choices{display:flex;gap:12px;margin:20px 0}
.choices button{flex:1}
.hidden{display:none!important}
.muted{font-size:13px;color:#977e89}
.status{font-size:13px;color:#a26980}
textarea{
 width:100%;height:115px;padding:14px;
 border:1px solid #e9c6d1;border-radius:14px;
 resize:vertical;font:inherit;font-size:16px
}
input{
 width:100%;padding:14px;border:1px solid #e9c6d1;
 border-radius:12px;font-size:16px
}
#share{
 position:absolute;right:14px;top:14px;
 background:#fff0f5;color:#b24c70;
 padding:9px 12px;font-size:13px
}
.answerGrid{display:flex;gap:10px;margin:20px 0}
.answerGrid div{
 flex:1;padding:16px 5px;border-radius:15px;
 background:#fff0f5;font-size:21px;font-weight:bold
}
.answerGrid small{display:block;font-size:12px;color:#947d86}
#error{color:#bd2953;font-size:13px;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<button id="share" class="hidden">♡ 招待</button>
<h1>💕 ふたりのホンネ</h1>
<p class="muted">ふたりの気持ちを、YES・NOで。</p>
<p id="status" class="status">準備しています…</p>
<p id="error" role="alert"></p>

<section id="linkScreen" class="hidden">
 <h2>ふたりのリンク ♡</h2>
 <p>招待リンクを開いてね。</p>
 <p class="muted">リンクがある場合はここに貼り付けてもOK。</p>
 <input id="linkInput" placeholder="招待リンク">
 <button id="openLink" class="primary">はじめる ♡</button>
</section>

<section id="roleScreen" class="hidden">
 <h2>あなたはどっち？</h2>
 <p>最初の1回だけ選んでね ♡</p>
 <div class="choices">
  <button id="role1" class="secondary">👤 1人目</button>
  <button id="role2" class="secondary">👤 2人目</button>
 </div>
 <p class="muted">同じ番号を選ばないようにしてね。</p>
</section>

<section id="appScreen" class="hidden">
 <p id="roleLabel" class="muted"></p>

 <section id="editor" class="hidden">
  <h2>何を聞いてみる？ ♡</h2>
  <textarea id="questionInput" maxlength="200"
   placeholder="今日は一緒に寝たい？"></textarea>
  <button id="ask" class="primary">質問する ♡</button>
 </section>

 <section id="vote" class="hidden">
  <h2 id="voteQuestion"></h2>
  <p>あなたの答えは？</p>
  <div class="choices">
   <button id="yes" class="secondary">♡ YES</button>
   <button id="no" class="secondary">NO</button>
  </div>
 </section>

 <section id="waiting" class="hidden">
  <h2 id="waitingQuestion"></h2>
  <p>回答したよ ♡</p>
  <p>相手の回答を待っています…</p>
 </section>

 <section id="result" class="hidden">
  <h2 id="resultQuestion"></h2>
  <p>ふたりの回答 ♡</p>
  <div class="answerGrid">
   <div><small>あなた</small><p id="mine"></p></div>
   <div><small>相手</small><p id="theirs"></p></div>
  </div>
  <button id="next" class="primary">次の質問へ ♡</button>
 </section>
</section>

<p class="muted">
 質問と回答は次の質問で消去されます。<br>
 招待リンクは信頼できる相手にだけ送ってね ♡
</p>
</main>

<script type="module">
import {initializeApp} from
'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,signInAnonymously,onAuthStateChanged} from
'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,doc,onSnapshot,runTransaction} from
'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';

const firebaseConfig={
 apiKey:"AIzaSyBpGIfu3jOksMS8_jPAUPXHuh4GzgwyUq8",
 authDomain:"futari-no-honne.firebaseapp.com",
 projectId:"futari-no-honne",
 storageBucket:"futari-no-honne.firebasestorage.app",
 messagingSenderId:"512221931738",
 appId:"1:512221931738:web:e69b8fd62b46c6eaa69de3"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);
const show=(id,yes)=>$(id).classList.toggle('hidden',!yes);

let pairId=new URLSearchParams(location.search).get('pair');
if(!pairId)pairId=localStorage.getItem('futariPair');
let pairRef=null;
let role=null;
let data=null;
let busy=false;
let unsubscribe=null;

function errorMessage(e){
 console.error(e);
 $('error').textContent=
 e.code==='permission-denied'
 ? 'アクセスできません。Firestoreのルールとリンクを確認してね。'
 : e.message||String(e);
}
function clearError(){$('error').textContent='';}
function setBusy(v){
 busy=v;
 for(const id of ['ask','yes','no','next'])
  $(id).disabled=v;
}
function hideScreens(){
 for(const id of ['linkScreen','roleScreen','appScreen'])
  show(id,false);
}
function start(){
 hideScreens();
 if(!pairId||!/^[A-Za-z0-9]{20}$/.test(pairId)){
  $('status').textContent='招待リンクを確認してね ♡';
  show('linkScreen',true);
  return;
 }
 localStorage.setItem('futariPair',pairId);
 const url=new URL(location.href);
 url.searchParams.set('pair',pairId);
 history.replaceState(null,'',url);
 pairRef=doc(db,'pairs',pairId);
 role=localStorage.getItem('futariRole:'+pairId);
 show('share',true);
 if(role!=='1'&&role!=='2'){
  $('status').textContent='はじめまして ♡';
  show('roleScreen',true);
 }else{
  connect();
 }
}
function chooseRole(value){
 role=value;
 localStorage.setItem('futariRole:'+pairId,value);
 connect();
}
function connect(){
 hideScreens();
 show('appScreen',true);
 $('roleLabel').textContent=
  (role==='1'?'1人目':'2人目')+'として参加中 ♡';
 $('status').textContent='接続しています…';
 if(unsubscribe)unsubscribe();
 unsubscribe=onSnapshot(pairRef,snapshot=>{
  if(!snapshot.exists()){
   $('status').textContent='データが見つかりません';
   $('error').textContent='招待リンクを確認してね。';
   return;
  }
  clearError();
  data=snapshot.data();
  $('status').textContent='ふたりの空間 ♡';
  render();
 },e=>{
  $('status').textContent='接続できませんでした';
  errorMessage(e);
 });
}
function render(){
 if(!data)return;
 const q=data.question||'';
 const mine=role==='1'?data.answer1:data.answer2;
 const other=role==='1'?data.answer2:data.answer1;
 const both=!!mine&&!!other;
 show('editor',!q);
 show('vote',!!q&&!mine&&!both);
 show('waiting',!!q&&!!mine&&!both);
 show('result',!!q&&both);
 if(q){
  $('voteQuestion').textContent=q;
  $('waitingQuestion').textContent=q;
  $('resultQuestion').textContent=q;
 }
 if(both){
  $('mine').textContent=mine;
  $('theirs').textContent=other;
 }
}
async function change(action,value){
 if(busy||!pairRef)return;
 clearError();
 setBusy(true);
 try{
  await runTransaction(db,async tx=>{
   const snap=await tx.get(pairRef);
   if(!snap.exists())throw Error('データがありません');
   const d=snap.data();
   const q=d.question||'';
   const a1=d.answer1||'';
   const a2=d.answer2||'';
   if(action==='ask'){
    if(q)throw Error('前の質問がまだ残っています');
    tx.update(pairRef,{
     question:value,answer1:'',answer2:'',
     status:'asking'
    });
   }else if(action==='answer'){
    if(!q)throw Error('質問がありません');
    const field=role==='1'?'answer1':'answer2';
    if(d[field])throw Error('回答済みです');
    const next1=role==='1'?value:a1;
    const next2=role==='2'?value:a2;
    tx.update(pairRef,{
     [field]:value,
     status:next1&&next2?'revealed':'asking'
    });
   }else if(action==='next'){
    if(!q||!a1||!a2)
     throw Error('まだ回答がそろっていません');
    tx.update(pairRef,{
     question:'',answer1:'',answer2:'',
     status:'ready'
    });
   }
  });
  if(action==='ask')$('questionInput').value='';
 }catch(e){errorMessage(e);}
 finally{setBusy(false);}
}
$('ask').onclick=()=>{
 const q=$('questionInput').value.trim();
 if(!q){$('error').textContent='質問を入力してね ♡';return;}
 change('ask',q);
};
$('yes').onclick=()=>change('answer','YES');
$('no').onclick=()=>change('answer','NO');
$('next').onclick=()=>change('next');
$('role1').onclick=()=>chooseRole('1');
$('role2').onclick=()=>chooseRole('2');
$('openLink').onclick=()=>{
 try{
  const input=$('linkInput').value.trim();
  const url=new URL(input,location.href);
  const id=url.searchParams.get('pair');
  if(!id||!/^[A-Za-z0-9]{20}$/.test(id))
   throw Error('正しい招待リンクを入力してね');
  pairId=id;
  start();
 }catch(e){errorMessage(e);}
};
$('share').onclick=async()=>{
 const url=new URL(location.href);
 url.searchParams.set('pair',pairId);
 const link=url.toString();
 try{
  if(navigator.share){
   await navigator.share({
    title:'💕 ふたりのホンネ',
    text:'一緒にYES・NOで答えよう ♡',
    url:link
   });
  }else if(navigator.clipboard){
   await navigator.clipboard.writeText(link);
   alert('リンクをコピーしたよ ♡');
  }else prompt('このリンクをコピーしてね',link);
 }catch(e){
  if(e.name!=='AbortError')errorMessage(e);
 }
};
start();
onAuthStateChanged(auth,async user=>{
 if(!user){
  try{await signInAnonymously(auth);}
  catch(e){errorMessage(e);}
 }
});
</script>
</body>
</html>
